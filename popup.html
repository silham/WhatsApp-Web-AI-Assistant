<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #25d366, #128c7e);
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
    }
    
    h1 {
      margin: 0;
      font-size: 18px;
      color: #333;
    }
    
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }
    
    .feature-list {
      list-style: none;
      padding: 0;
      margin: 20px 0;
    }
    
    .feature-list li {
      padding: 8px 0;
      font-size: 14px;
      color: #555;
      display: flex;
      align-items: center;
    }
    
    .feature-list li:before {
      content: "✓";
      color: #25d366;
      font-weight: bold;
      margin-right: 10px;
    }
    
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
      font-size: 14px;
    }
    
    .primary-btn {
      background: #25d366;
      color: white;
    }
    
    .primary-btn:hover {
      background: #128c7e;
    }
    
    .secondary-btn {
      background: #f8f9fa;
      color: #333;
      border: 1px solid #e9ecef;
    }
    
    .secondary-btn:hover {
      background: #e9ecef;
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }
    
    .status-success {
      background: #d4edda;
      color: #155724;
    }
    
    .status-error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .status-warning {
      background: #fff3cd;
      color: #856404;
    }

    .provider-line {
      margin: 0 0 12px;
      font-size: 13px;
      color: #555;
      text-align: center;
    }

    .provider-line strong {
      color: #128c7e;
    }

    .permission-notice {
      display: none;
      background: #fff3cd;
      color: #856404;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .permission-notice button {
      width: 100%;
      margin-top: 8px;
      background: #856404;
      color: white;
      padding: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🤖</div>
    <h1 data-i18n="app.name">WhatsApp AI Assistant</h1>
    <div class="subtitle" data-i18n="popup.subtitle">Export &amp; Generate AI Responses</div>
  </div>
  
  <ul class="feature-list">
    <li data-i18n="popup.feature.export">Export full conversations</li>
    <li data-i18n="popup.feature.generate">Generate AI responses with any provider</li>
    <li data-i18n="popup.feature.insert">Auto-insert responses</li>
    <li data-i18n="popup.feature.copy">Copy to clipboard</li>
  </ul>
  
  <div id="providerLine" class="provider-line"></div>

  <div id="permissionNotice" class="permission-notice">
    <span id="permissionText"></span>
    <button id="grantPermission" type="button" data-i18n="popup.grantAccess">Grant access</button>
  </div>

  <div class="action-buttons">
    <button id="openWhatsApp" class="primary-btn" data-i18n="popup.openWhatsApp">Open WhatsApp Web</button>
    <button id="openSettings" class="secondary-btn" data-i18n="popup.configureSettings">Configure Settings</button>
    <button id="viewHelp" class="secondary-btn" data-i18n="popup.viewHelp">View Help</button>
  </div>
  
  <div id="status" class="status" style="display: none;"></div>

  <script src="lib/i18n.js"></script>
  <script src="lib/providers.js"></script>
  <script src="lib/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
