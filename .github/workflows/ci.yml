name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, validate and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', 'lts/*']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate manifest
        run: npm run check:manifest

      - name: Test
        run: npm test

  package:
    name: Build the extension bundle
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run package

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: extension-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
